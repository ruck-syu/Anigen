name: Build Android APK

# Runs only on pushes to main, which includes merged pull requests.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'windows/**'
      - 'linux/**'
      - 'macos/**'
      - '.github/workflows/windows.yml'

permissions:
  # Publishing the release
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in step with .fvmrc
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # Optional: sign with a stable key so new builds install over old ones.
      # Secrets: ANDROID_KEYSTORE_BASE64 (base64 of the .jks),
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      # Without them the APK is signed with a throwaway debug key.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets; using the debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build APKs
        # BUILD_NUMBER lets the app compare itself with the latest release
        run: >-
          flutter build apk --release --split-per-abi
          --build-number=${{ github.run_number }}
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Rename APKs
        run: |
          mkdir -p dist
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/app-(.*)-release.apk/\1/')
            cp "$apk" "dist/Anigen-build-${{ github.run_number }}-$abi.apk"
          done
          ls -la dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Anigen-Android-${{ github.run_number }}
          path: dist/*.apk

      # The app's update button installs from the latest of these. Tags must
      # stay build-<run number>: the app reads the build from the tag.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Anigen build ${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          files: dist/*.apk
