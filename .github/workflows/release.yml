name: Release

# Runs only on pushes to main, which includes merged pull requests. Builds
# Android, Windows and macOS, then publishes them as one GitHub release.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'linux/**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in step with .fvmrc
  FLUTTER_VERSION: '3.44.2'

jobs:
  # Versions are v<major>.<minor>.<patch>: major.minor comes from
  # pubspec.yaml, the patch is one past the newest tag in that series.
  # Bump the minor (or major) in pubspec.yaml to start a new series.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      code: ${{ steps.pick.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick version
        id: pick
        shell: bash
        run: |
          series=$(sed -nE 's/^version: *([0-9]+\.[0-9]+)\.[0-9]+.*/\1/p' pubspec.yaml)
          if [[ ! $series =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read the release series from pubspec.yaml"
            exit 1
          fi
          series_pattern=${series//./\\.}
          last=$(git ls-remote --tags origin "refs/tags/v$series.*" \
            | sed -nE "s|.*refs/tags/v$series_pattern\.([0-9]+)$|\1|p" | sort -n | tail -1)
          patch=0
          if [[ -n $last ]]; then
            if [[ ! $last =~ ^0*[0-9]{1,4}$ ]]; then
              echo "::error::Patch version must be less than 10000"
              exit 1
            fi
            patch=$(( 10#$last + 1 ))
          fi
          version="$series.$patch"
          # Android only installs an update with a higher versionCode, so it
          # comes from the version itself: 1.6.2 -> 1060002. (Not the run
          # number, which restarts whenever the workflow is renamed.)
          IFS=. read -r major minor <<< "$series"
          if [[ ! $minor =~ ^0*[0-9]{1,2}$ ]] || (( patch >= 10000 )); then
            echo "::error::Minor version must be less than 100 and patch less than 10000"
            exit 1
          fi
          code=$(( 10#$major * 1000000 + 10#$minor * 10000 + 10#$patch ))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building v$version (versionCode $code)"

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CODE: ${{ needs.version.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # Optional: sign with a stable key so new builds install over old ones.
      # Secrets: ANDROID_KEYSTORE_BASE64 (base64 of the .jks),
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      # Without them the APK is signed with a throwaway debug key.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets; using the debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          property() {
            local value=$2
            value=${value//\\/\\\\}
            value=${value// /\\ }
            value=${value//$'\t'/\\t}
            value=${value//$'\r'/\\r}
            value=${value//$'\n'/\\n}
            printf '%s=%s\n' "$1" "$value"
          }
          {
            property storeFile release.jks
            property storePassword "$STORE_PASSWORD"
            property keyAlias "$KEY_ALIAS"
            property keyPassword "$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        # 64-bit ARM only. APP_VERSION lets the app compare itself with the
        # latest release
        run: >-
          flutter build apk --release
          --target-platform=android-arm64
          --build-name=$VERSION
          --build-number=$CODE
          --dart-define=APP_VERSION=$VERSION

      # The app's updater picks the asset ending in -<abi>.apk
      - name: Name APK and generate SHA-256 checksum
        run: |
          mkdir -p dist
          apk="Anigen-v$VERSION-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$apk"
          cd dist
          sha256sum "$apk" > "$apk.sha256"
          ls -la

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            dist/*.apk
            dist/*.apk.sha256

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      # No build number: Windows file versions cap each part at 65535
      - name: Build app
        run: >-
          flutter build windows --release
          --build-name=${{ env.VERSION }}
          --dart-define=APP_VERSION=${{ env.VERSION }}

      # Flutter apps need the VC++ runtime; ship it beside the exe so the app
      # starts on PCs that don't have it
      - name: Bundle VC++ runtime
        shell: pwsh
        run: |
          $release = 'build\windows\x64\runner\Release'
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $release
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc /DAppVersion=$env:VERSION /O"$PWD\dist" windows\installer\anigen.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    needs: version
    # Pinned: Xcode 27's lipo breaks Flutter 3.44's universal-binary check
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CODE: ${{ needs.version.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      # Universal (Apple silicon and Intel); signed ad hoc here, re-signed below
      - name: Build app
        run: >-
          flutter build macos --release
          --build-name=$VERSION
          --build-number=${{ env.CODE }}
          --dart-define=APP_VERSION=$VERSION

      # The same certificate every release keeps the app's identity stable, so
      # macOS doesn't ask signed-in users for keychain access after updates.
      # Make it with scripts/macos-signing-cert.sh. Without the secrets the
      # build stays signed ad hoc.
      - name: Build disk image
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          mkdir -p dmg dist
          cp -R build/macos/Build/Products/Release/anigen.app dmg/Anigen.app
          ln -s /Applications dmg/Applications
          if [[ -n $MACOS_CERTIFICATE ]]; then
            scripts/macos-sign.sh dmg/Anigen.app
          else
            echo "::warning::MACOS_CERTIFICATE isn't set; the app is signed ad hoc and users will see keychain prompts after updates"
          fi
          codesign --verify --deep --strict dmg/Anigen.app
          hdiutil create -volname Anigen -srcfolder dmg -ov -format UDZO \
            "dist/Anigen-v$VERSION-macos.dmg"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  # Android is required: the app's update button installs from the latest
  # release. A desktop build that fails is left out rather than holding it up.
  release:
    needs: [version, android, windows, macos]
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List builds
        run: ls -la dist

      # Tags must stay v<version>: the app reads the version from the tag
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Anigen v${{ env.VERSION }}
          body: |
            **Android:** the `arm64-v8a` APK, for 64-bit phones and tablets. Installed copies can update from settings.
            **Windows:** run the `setup.exe`. SmartScreen may warn that the app isn't recognised: choose *More info → Run anyway*.
            **macOS:** open the `.dmg` and drag Anigen to Applications. The app isn't notarised, so the first time macOS blocks it: open *System Settings → Privacy & Security* and choose *Open Anyway*.
          generate_release_notes: true
          make_latest: true
          files: dist/*
